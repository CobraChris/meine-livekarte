name: Test and deploy static site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check core.js && node --check walking-core.js && node --check app.js && node --check sync.js && node --check outbox-core.js && node --check sync-out.js && node --check pwa.js && node --check sw.js && node --test tests/*.test.cjs
      - name: Temporary one-request 4-point Takayama FOSSGIS foot CORS/leg smoke check
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import urllib.request
          import json
          url=('https://routing.openstreetmap.de/routed-foot/route/v1/driving/'
               '137.255000,36.140000;137.257640,36.139640;'
               '137.259220,36.140000;137.259660,36.140880'
               '?overview=full&geometries=geojson&steps=false&alternatives=false')
          request=urllib.request.Request(url,headers={
            'Accept':'application/json',
            'Origin':'https://cobrachris.github.io',
            'Referer':'https://cobrachris.github.io/meine-livekarte/',
            'User-Agent':'MeineLivekarte/1.0 (+https://cobrachris.github.io/meine-livekarte/)'
          })
          with urllib.request.urlopen(request,timeout=18) as response:
            data=json.load(response)
            print('OSRM:',data.get('code'))
            print('CORS:',response.headers.get('Access-Control-Allow-Origin'))
            print('Waypoints:',len(data.get('waypoints',[])))
            legs=data.get('routes',[{}])[0].get('legs',[])
            print('Legs:',len(legs))
            print('Distance:',data.get('routes',[{}])[0].get('distance'))
            assert data.get('code')=='Ok'
            assert len(data.get('waypoints',[]))==4
            assert len(legs)==3
            assert data['routes'][0]['geometry']['type']=='LineString'
            assert response.headers.get('Access-Control-Allow-Origin') in ('*','https://cobrachris.github.io')
          PY
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public files only
        run: |
          mkdir public
          cp index.html style.css core.js walking-core.js app.js sync.js outbox-core.js sync-out.js pwa.js sw.js manifest.json public/
          cp -r vendor public/
          cp -r sync public/
          mkdir -p public/icons
          cp icons/livekarte.svg public/icons/
      - name: Stamp deployed PWA version and cache-bust local assets
        run: python3 scripts/stamp_pwa_version.py
      - name: Generate PNG PWA icons
        run: |
          python3 -m venv /tmp/livekarte-pwa-icons
          /tmp/livekarte-pwa-icons/bin/python -m pip install --disable-pip-version-check -q CairoSVG==2.8.2
          /tmp/livekarte-pwa-icons/bin/python scripts/build_pwa_icons.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
