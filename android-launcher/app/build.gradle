plugins { id 'com.android.application' }
android {
    namespace 'de.cobrachris.livekarte.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'de.cobrachris.livekarte.launcher'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
