<!-- C monogram is the dashed route, open to the right between its two ends. -->
<path d="M366 142 C248 115 178 158 178 252 C178 340 239 387 361 357" fill="none" stroke="#0c4d43" stroke-width="26" stroke-linecap="round" opacity=".55"/>
<path d="M366 142 C248 115 178 158 178 252 C178 340 239 387 361 357" fill="none" stroke="#ffd44e" stroke-width="19" stroke-linecap="round" stroke-dasharray="17 27"/>
<circle cx="361" cy="357" r="13" fill="#ffda5a"/><circle cx="361" cy="357" r="5" fill="#076351"/>
<!-- Golden destination pin. -->
<path d="M389 71 C344 71 318 104 318 142 C318 178 355 210 389 242 C424 207 460 172 460 142 C460 104 435 71 389 71 Z" fill="#03382f" opacity=".5" transform="translate(1 8)"/>
<path d="M389 66 C344 66 318 99 318 137 C318 173 355 205 389 237 C424 202 460 167 460 137 C460 99 435 66 389 66 Z" fill="url(#pin)" stroke="#ffe28a" stroke-width="4"/>
<circle cx="389" cy="134" r="25" fill="#06463a"/>
<circle cx="389" cy="134" r="13" fill="#07342f"/>
</svg>