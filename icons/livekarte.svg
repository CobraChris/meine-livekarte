<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Meine Live-Karte: gefaltete Karte mit C-förmiger Reiseroute">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#076052"/><stop offset=".53" stop-color="#053a36"/><stop offset="1" stop-color="#05262a"/></linearGradient>
  <radialGradient id="light" cx=".26" cy=".14" r=".95"><stop stop-color="#0ca087" stop-opacity=".5"/><stop offset="1" stop-color="#06352e" stop-opacity="0"/></radialGradient>
  <linearGradient id="mapL" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#56dca2"/><stop offset="1" stop-color="#087855"/></linearGradient>
  <linearGradient id="mapM" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#08704d"/><stop offset="1" stop-color="#033c3a"/></linearGradient>
  <linearGradient id="mapR" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b846c"/><stop offset="1" stop-color="#0c5664"/></linearGradient>
  <linearGradient id="pin" x1="0" x2=".8" y1="0" y2="1"><stop stop-color="#fff19a"/><stop offset=".55" stop-color="#ffd45c"/><stop offset="1" stop-color="#eea929"/></linearGradient>
  <clipPath id="mapClip"><path d="M78 145 Q78 125 98 113 L200 74 L300 113 L401 74 Q426 66 438 91 Q444 98 444 114 L444 360 Q444 378 426 386 L302 433 L200 396 L89 432 Q68 437 68 414 Z"/></clipPath>
